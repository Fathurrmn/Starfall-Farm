    while(AM.popT<now+.25){aBurst(AM.wh,AM.popT,.02+Math.random()*.03,'bandpass',1500+Math.random()*2000,.8,(.012+Math.random()*.04)*fl,pan,AM.bus,.003);AM.popT+=.06+Math.random()*.35}}
  else AM.popT=now;
  // jangkrik (malam; tidak di musim dingin; diam saat hujan deras)
  const ck=night*[.7,1,.6,0][SE]*(1-Math.min(1,rain*2));
  if(ck>.05)for(const v of AM.cr){
    if(v.next<now)v.next=now+Math.random()*.4;
    while(v.next<now+.3){
      if(Math.random()<.75){const o=c.createOscillator(),g=c.createGain(),p=c.createStereoPanner();o.type='sine';o.frequency.value=v.f*(.98+Math.random()*.04);p.pan.value=v.pan;o.connect(g);g.connect(p);p.connect(AM.bus);
        for(let k=0;k<4;k++){const tt=v.next+k*.028;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.045*ck,tt+.006);g.gain.linearRampToValueAtTime(0,tt+.02)}
        o.start(v.next);o.stop(v.next+.14)}
      v.next+=.5+Math.random()*.45}}
  // kereta uap: gemuruh roda, desis, hentakan uap, peluit, lonceng stasiun (bergeser kiri-kanan mengikuti posisi kereta)
  const tv=P.train!=='off'&&train.wait<=0,cx=train.dir>0?train.x-66:train.x+66;
  const vis=(tv&&cx>-110&&cx<W+110)?Math.max(0,Math.min(1,1-Math.max(0,Math.abs(cx-W/2)-W/2)/110)):0,spd=train.v||0;
  AM.trainPan.pan.setTargetAtTime(Math.max(-1,Math.min(1,(cx/W*2-1)*.85)),now,.2);
  AM.trainRumG.gain.setTargetAtTime(vis*(.07+Math.min(1,spd/18)*.16),now,.25);
  AM.hissG.gain.setTargetAtTime(vis*(train.hold>0?.04:.004),now,.4);
  if(vis>.05){
    if(!AM.wasIn){AM.wasIn=true;whistle(now+.05,.9,vis)}
    if(train.kind==='pax'&&P.trainstop&&!train.stopped&&!AM.brk){const dist=(.42*W+train.dir*40-train.x)*train.dir;
      if(dist<55&&dist>0){AM.brk=true;whistle(now+.05,.4,vis);aBurst(AM.pk,now+.1,1.6,'bandpass',2600,.6,.07*vis,undefined,AM.trainPan,.25)}}
    if(train.hold>0&&!AM.held){AM.held=true;aBell(now+.2);aBell(now+.9);aBell(now+1.6)}
    if(AM.held&&train.hold<=0&&!AM.left){AM.left=true;aBurst(AM.pk,now+.05,1.4,'bandpass',2600,.6,.08*vis,undefined,AM.trainPan,.2);whistle(now+.6,.35,vis)}
    const iv=Math.max(.32,Math.min(1.3,6/Math.max(2,spd)));if(AM.chT<now)AM.chT=now+.05;
    while(AM.chT<now+.25){chuff(AM.chT,vis);AM.chT+=iv}
    if(spd>2){if(AM.clT<now)AM.clT=now;while(AM.clT<now+.25){aBurst(AM.br,AM.clT,.05,'bandpass',300,1.2,.1*vis*(.5+Math.random()*.5),undefined,AM.trainPan,.006);AM.clT+=(1/(spd/3))*(.7+Math.random()*.6)}}
  }else{AM.wasIn=false;AM.brk=false;AM.held=false;AM.left=false;AM.chT=0;AM.clT=0}
  // kapal pemancing: dengung mesin kecil yang berdenyut
  const so=P.boats&&SE!==3&&ship.wait<=0&&ship.x>-45&&ship.x<W+45;
  AM.engG.gain.setTargetAtTime(so?.13:0,now,.6);AM.shipPan.pan.setTargetAtTime(Math.max(-1,Math.min(1,(ship.x/W*2-1)*.8)),now,.3)}
function frame(now){
  requestAnimationFrame(frame);
  if(now-last<1000/P.fps)return;const dt=Math.min(.1,(now-last)/1000);last=now;
  const d=new Date();const se=seasonNow();if(se!==SE||P.trees!==treesBuilt){SE=se;build()}
  let h=dev!==null?dev:(P.mode==='manual'?P.jam:d.getHours()+d.getMinutes()/60+d.getSeconds()/3600);
  if(dev!==null)$('tl').textContent=String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor(h%1*60)).padStart(2,'0');
  draw(warp(h,d),now/1000,d,dt);clock(h,d);
}
